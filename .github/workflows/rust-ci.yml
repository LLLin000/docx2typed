name: Rust CI

on:
  push:
    branches: [main, rust-rewrite]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The inspect/migrate differential tests drive the Python Reference
      # binary as the offline oracle; install the Python package so
      # `python -m scripts` works in cargo tests.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python oracle
        run: python -m pip install -e .
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Test
        run: cargo test --workspace
      - name: Release build
        run: cargo build --release

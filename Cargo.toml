[package]
name = "docx2typed"
version = "0.1.0-rc1"
edition = "2021"
rust-version = "1.85"
description = "Structure-preserving DOCX editing engine with verified MCP review workflows"
license = "MIT"

[workspace]
members = [
    "crates/docx2typed-protocol",
    "crates/docx2typed-core",
    "crates/docx2typed-store",
    "crates/docx2typed-verify",
    "crates/docx2typed-review",
    "crates/docx2typed-app",
]
resolver = "2"

[dependencies]
docx2typed-app = { path = "crates/docx2typed-app" }
docx2typed-core = { path = "crates/docx2typed-core" }
docx2typed-protocol = { path = "crates/docx2typed-protocol" }
docx2typed-review = { path = "crates/docx2typed-review" }
docx2typed-store = { path = "crates/docx2typed-store" }
serde_json = "1"

[dev-dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
hex = "0.4"
regex = "1"

[[test]]
name = "differential"
path = "rust-tests/differential.rs"

[[test]]
name = "migrate"
path = "rust-tests/migrate.rs"

[[test]]
name = "tracer"
path = "rust-tests/tracer.rs"

[[test]]
name = "prose"
path = "rust-tests/prose.rs"

[[test]]
name = "govern"
path = "rust-tests/govern.rs"

[[test]]
name = "review60"
path = "rust-tests/review60.rs"

[[test]]
name = "tracer62"
path = "rust-tests/tracer62.rs"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docx2typed"
version = "0.1.0"
description = "Structure-preserving typed-mode DOCX text editing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "python-docx>=1.1,<2",
  "mcp>=1.25,<2",
]

[project.scripts]
docx2typed = "docx2typed:main"
docx2typed-mcp = "docx2typed.mcp_server:main"

[tool.setuptools]
packages = ["docx2typed"]
package-dir = {docx2typed = "scripts"}
include-package-data = true

[tool.setuptools.package-data]
docx2typed = ["unicode_vertical_catalog.json"]

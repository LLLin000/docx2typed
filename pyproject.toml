[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docx2typed"
version = "0.2.0"
description = "Structure-preserving typed-mode DOCX text editing"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Text Processing",
]

dependencies = [
  "python-docx==1.2.0",
  "lxml==6.1.1",
  "mcp>=1.25,<2",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6",
  "pytest>=8",
  "pytest-xdist>=3",
]

[project.urls]
Homepage = "https://github.com/LLLin000/docx2typed"
Repository = "https://github.com/LLLin000/docx2typed"
Installation = "https://github.com/LLLin000/docx2typed/blob/main/Installation.md"

[project.scripts]
docx2typed = "docx2typed:main"
docx2typed-mcp = "docx2typed.mcp_server:main"
docx2typed-review = "docx2typed.review_server:main"
[tool.setuptools]
packages = ["docx2typed"]
package-dir = {docx2typed = "scripts"}
include-package-data = true

[tool.setuptools.package-data]
docx2typed = ["protocol_schema_bundle.json", "unicode_vertical_catalog.json"]

[tool.setuptools.data-files]
"share/docx2typed" = ["capabilities/manifest.json"]

[tool.pytest.ini_options]
# The default run is the fast feedback loop: the `slow` release-gate marker is
# excluded, and pytest-xdist spreads the suite across the machine's cores
# (worksteal balances the few very long tests against the many short ones).
# `-n0` runs one process, which is the better deal for a focused selection.
addopts = "-m 'not slow' -n auto --dist worksteal"
markers = [
    "slow: release-gate checks that run the whole qualification plan",
]
